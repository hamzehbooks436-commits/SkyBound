name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'capacitor.config.json'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'tools/verify_ipa.py'

permissions:
  contents: read

concurrency:
  group: skybound-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Run input regression tests
        run: npm test
      - name: Bundle the game and synchronize iOS
        run: npm run ios:sync
      - name: Archive the device app without signing
        run: |
          set -o pipefail
          mkdir -p build output
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/SkyBound.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            archive > build/xcodebuild.log 2>&1 || { tail -n 120 build/xcodebuild.log; exit 1; }
      - name: Package and verify the IPA
        run: |
          mkdir -p build/Payload
          cp -R build/SkyBound.xcarchive/Products/Applications/App.app build/Payload/
          xcrun lipo build/Payload/App.app/App -verify_arch arm64
          ditto -c -k --keepParent build/Payload output/SkyBound-unsigned.ipa
          python3 tools/verify_ipa.py output/SkyBound-unsigned.ipa
          cp IOS-INSTALL.md output/INSTALL.txt
          shasum -a 256 output/SkyBound-unsigned.ipa > output/SHA256.txt
          printf 'Built **SkyBound-unsigned.ipa** for a physical iPad. Bundled game assets work offline. This file must be signed with a sideloading tool before installation. Download the SkyBound-iPad-IPA artifact below.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkyBound-iPad-IPA
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
